<!DOCTYPE html>
<html lang="zh-CN" id="top">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>作者主页｜泡菜小说坊</title>

  <!-- 当前文件放在 authors 文件夹里，所以路径前面要加 ../ -->
  <link rel="icon" href="../assets/images/logo/logo.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">

  <style>
    :root {
      --bg: #f6f0e5;
      --paper: #fffaf0;
      --sage: #7f9368;
      --sage-dark: #5f754b;
      --purple: #dcd5ee;
      --pink: #f1d3d7;
      --text: #3f3a32;
      --muted: #8a8175;
      --line: #eadfce;
      --warm: #cf9264;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(220, 213, 238, 0.55), transparent 35%),
        radial-gradient(circle at top right, rgba(241, 211, 215, 0.55), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .page-wrap {
      width: min(1120px, 92%);
      margin: 0 auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 250, 240, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      width: min(1120px, 92%);
      margin: 0 auto;
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--sage-dark);
      font-weight: 800;
      font-size: 22px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 14px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .nav-links a,
    .nav-links button {
      border: none;
      background: #fffaf0;
      color: var(--sage-dark);
      padding: 9px 14px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(95, 117, 75, 0.08);
    }

    .nav-links a:hover,
    .nav-links button:hover {
      background: var(--sage);
      color: #fff;
    }

    .author-hero {
      margin-top: 36px;
      background: rgba(255, 250, 240, 0.86);
      border: 1px solid var(--line);
      border-radius: 32px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(95, 117, 75, 0.12);
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 28px;
      align-items: center;
    }

    .author-avatar {
      width: 160px;
      height: 160px;
      border-radius: 36px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      padding: 10px;
    }

    .author-avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 28px;
      display: block;
      background: #fffaf0;
    }

    .author-info h1 {
      margin: 0 0 10px;
      color: var(--sage-dark);
      font-size: clamp(34px, 6vw, 56px);
      letter-spacing: 0.04em;
    }

    .author-info p {
      margin: 0;
      line-height: 1.9;
      color: #514a42;
    }

    .author-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 18px;
    }

    .author-meta span {
      background: rgba(220, 213, 238, 0.55);
      border: 1px solid rgba(127, 147, 104, 0.18);
      color: var(--sage-dark);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 14px;
    }

    .action-row {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-primary {
      background: var(--sage);
      color: #fff;
      box-shadow: 0 10px 22px rgba(127, 147, 104, 0.25);
    }

    .btn-primary:hover {
      background: var(--sage-dark);
    }

    .btn-soft {
      background: #fffaf0;
      color: var(--sage-dark);
      border-color: var(--line);
    }

    .btn-soft:hover {
      background: var(--purple);
    }

    .section {
      margin-top: 34px;
      background: rgba(255, 250, 240, 0.86);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 14px 34px rgba(95, 117, 75, 0.08);
    }

    .section h2 {
      margin: 0 0 18px;
      color: var(--sage-dark);
      font-size: 26px;
    }

    .works-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .work-card {
      text-decoration: none;
      color: var(--text);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 10px 24px rgba(95, 117, 75, 0.10);
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .work-card:hover {
      transform: translateY(-4px);
      border-color: var(--sage);
    }

    .work-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 18px;
      display: block;
      background: linear-gradient(135deg, var(--purple), var(--pink));
    }

    .work-card h3 {
      margin: 12px 0 8px;
      color: var(--sage-dark);
      font-size: 18px;
      line-height: 1.4;
    }

    .work-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .work-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .work-tags span {
      font-size: 12px;
      color: var(--sage-dark);
      background: rgba(220, 213, 238, 0.55);
      padding: 5px 8px;
      border-radius: 999px;
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .social-card {
      text-decoration: none;
      color: var(--text);
      background: linear-gradient(135deg, #fffaf0, #f7eff8);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
      text-align: center;
    }

    .social-card:hover {
      transform: translateY(-2px);
      border-color: var(--sage);
    }

    .social-card strong {
      display: block;
      color: var(--sage-dark);
      margin-bottom: 8px;
      font-size: 18px;
    }

    .social-card span {
      color: var(--muted);
      font-size: 14px;
    }

    .page-nav {
      margin: 34px 0 56px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .site-footer {
      border-top: 1px solid var(--line);
      background: rgba(255, 250, 240, 0.75);
      padding: 26px 0;
      color: var(--muted);
      text-align: center;
    }

    body.dark-mode {
      --bg: #252820;
      --paper: #31362b;
      --text: #f2eadf;
      --muted: #c9beaf;
      --line: rgba(255,255,255,0.12);
      background: #252820;
      color: var(--text);
    }

    body.dark-mode .site-header,
    body.dark-mode .author-hero,
    body.dark-mode .section,
    body.dark-mode .site-footer {
      background: rgba(49, 54, 43, 0.92);
    }

    body.dark-mode .work-card,
    body.dark-mode .btn-soft,
    body.dark-mode .social-card,
    body.dark-mode .nav-links a,
    body.dark-mode .nav-links button {
      background: #31362b;
      color: var(--text);
    }

    body.dark-mode .author-info h1,
    body.dark-mode .section h2,
    body.dark-mode .brand,
    body.dark-mode .work-card h3,
    body.dark-mode .social-card strong {
      color: #b8c8a4;
    }

    body.dark-mode .author-info p,
    body.dark-mode .work-card p,
    body.dark-mode .social-card span {
      color: #e6ddcf;
    }

    body.dark-mode .author-meta span,
    body.dark-mode .work-tags span {
      background: rgba(220, 213, 238, 0.12);
      color: #e6ddcf;
      border-color: rgba(255,255,255,0.12);
    }

    body.dark-mode .btn-primary {
      background: #7f9368;
      color: #fff;
    }

    @media (max-width: 960px) {
      .works-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 720px) {
      .nav {
        align-items: flex-start;
        flex-direction: column;
        padding: 14px 0;
      }

      .author-hero {
        grid-template-columns: 1fr;
        padding: 22px;
      }

      .author-avatar {
        width: 130px;
        height: 130px;
      }

      .works-grid,
      .social-grid {
        grid-template-columns: 1fr;
      }

      .work-card img {
        height: 320px;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <nav class="nav">

      <a class="brand" href="../index.html">
        <img src="../assets/images/logo/logo.png" alt="泡菜小说坊 Logo">
        <span>泡菜小说坊</span>
      </a>

      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a href="../stories.html">Stories</a>
        <a href="../search.html">搜索</a>
        <button type="button" id="themeToggle">夜间模式</button>
      </div>
    </nav>
  </header>

  <main class="page-wrap">

    <section class="author-hero">
      <div class="author-avatar">
        <img id="authorAvatar" src="" alt="作者头像">
      </div>

      <div class="author-info">
        <h1 id="authorName"></h1>

        <div class="author-meta" id="authorMeta"></div>

        <p id="authorBio"></p>

        <div class="action-row">
          <a class="btn btn-primary" href="#works">查看全部作品</a>
          <a class="btn btn-soft" href="#social">咨询服务</a>
          <a class="btn btn-soft" href="../stories.html">返回小说列表</a>
        </div>
      </div>
    </section>

    <section class="section" id="works">
      <h2 id="worksTitle">作者作品</h2>
      <div class="works-grid" id="worksGrid"></div>
    </section>

    <section class="section" id="social">
      <h2>服务咨询</h2>
      <p>关注作者作品更新或通过以下咨询后续内容。</p>
      <div class="social-grid" id="socialGrid"></div>
    </section>

    <div class="page-nav">
      <a class="btn btn-soft" href="../stories.html">← 返回小说列表</a>
      <a class="btn btn-primary" href="#top">返回顶部 ↑</a>
    </div>

  </main>

  <footer class="site-footer">
    <div class="page-wrap">
      <p>© 泡菜小说坊 Paocai Novels</p>
      <p>作者作品合集 · 免费试读 · 入口咨询</p>
    </div>
  </footer>

  <script>
    /*
      ==================================================
      作者主页信息填写区
      ==================================================

      下次套用方法：

      1. 复制这个文件。
      2. 改名为 authors/作者英文名.html。
         例如：
         authors/whale.html
         authors/kim.html

      3. 修改下面 authorData 里的内容。
      4. 作者作品继续添加到 works: [ ... ] 里面。
    */

    const authorData = {
      name: "Whale",
      avatar: "../assets/images/logo/logo.png",
      intro: "泡菜小说坊收录作者。作品偏向现代、悬疑、暗黑拉扯与复杂关系。",
      category: "耽美 / 现代 / 悬疑",
      workCount: "1 本作品",
      updateText: "持续更新中",

      works: [
        {
          title: "猎捕燕子",
          cover: "../assets/images/covers/hunting-swallow.png",
          link: "../novels/hunting-swallow.html",
          summary: "危险的猎人与无法逃脱的燕子，在控制、试探与欲望之间展开一场极限拉扯。",
          tags: ["耽美", "现代", "悬疑", "暗黑拉扯"]
        }

        /*
          以后这个作者的其他小说继续加在这里。

          如果要加第二本，上一条作品后面要加英文逗号 ,

          示例：

          ,
          {
            title: "第二本小说名",
            cover: "../assets/images/covers/second-cover.png",
            link: "../novels/second-novel.html",
            summary: "这里填写第二本小说简介。",
            tags: ["现代", "悬疑", "爱情"]
          }
        */
      ],

      social: [
        {
          name: "微博",
          text: "查看更新 / 私信咨询",
          link: "https://weibo.com/"
        },
        {
          name: "微信",
          text: "扫码添加 / 咨询后续章节",
          link: "../assets/images/icons/wechat-qr.svg"
        },
        {
          name: "小红书",
          text: "作品动态 / 下单入口",
          link: "https://www.xiaohongshu.com/"
        }
      ]
    };

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderAuthorPage(data) {
      document.title = `${data.name} 作者主页｜泡菜小说坊`;

      const avatar = document.getElementById("authorAvatar");
      avatar.src = data.avatar;
      avatar.alt = `${data.name} 作者头像`;

      document.getElementById("authorName").textContent = `${data.name} 作者主页`;

      document.getElementById("authorMeta").innerHTML = `
        <span>${escapeHTML(data.category)}</span>
        <span>${escapeHTML(data.workCount)}</span>
        <span>${escapeHTML(data.updateText)}</span>
      `;

      document.getElementById("authorBio").textContent = data.intro;
      document.getElementById("worksTitle").textContent = `${data.name} 的全部作品`;

      document.getElementById("worksGrid").innerHTML = data.works.map(work => `
        <a class="work-card" href="${work.link}">
          <img src="${work.cover}" alt="${escapeHTML(work.title)}封面">
          <h3>${escapeHTML(work.title)}</h3>
          <p>${escapeHTML(work.summary)}</p>
          <div class="work-tags">
            ${work.tags.map(tag => `<span>${escapeHTML(tag)}</span>`).join("")}
          </div>
        </a>
      `).join("");

      document.getElementById("socialGrid").innerHTML = data.social.map(item => `
        <a class="social-card" href="${item.link}" target="_blank" rel="noopener">
          <strong>${escapeHTML(item.name)}</strong>
          <span>${escapeHTML(item.text)}</span>
        </a>
      `).join("");
    }

    renderAuthorPage(authorData);

    const themeToggle = document.getElementById("themeToggle");
    const savedTheme = localStorage.getItem("paocai-theme");

    if (savedTheme === "dark") {
      document.body.classList.add("dark-mode");
      themeToggle.textContent = "日间模式";
    }

    themeToggle.addEventListener("click", function () {
      document.body.classList.toggle("dark-mode");

      if (document.body.classList.contains("dark-mode")) {
        localStorage.setItem("paocai-theme", "dark");
        themeToggle.textContent = "日间模式";
      } else {
        localStorage.setItem("paocai-theme", "light");
        themeToggle.textContent = "夜间模式";
      }
    });
  </script>

</body>
</html>
