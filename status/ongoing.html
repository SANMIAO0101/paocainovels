rd{text-decoration:none;color:var(--text);background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:14px;box-shadow:0 10px 24px rgba(95,117,75,.10)}.novel-card:hover{transform:translateY(-4px);border-color:var(--sage)}.novel-card img{width:100%;height:260px;object-fit:cover;border-radius:18px}.novel-card h3{color:var(--sage-dark);margin:12px 0 8px}.novel-card p{color:var(--muted);font-size:14px;line-height:1.6}.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.meta span{font-size:12px;color:var(--sage-dark);background:rgba(220,213,238,.55);padding:5px 8px;border-radius:999px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;border-radius:999px;text-decoration:none}.btn-primary{background:var(--sage);color:#fff}.btn-soft{background:#fffaf0;color:var(--sage-dark);border:1px solid var(--line)}.page-nav{margin:34px 0 56px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}.site-footer{border-top:1px solid var(--line);background:rgba(255,250,240,.75);padding:26px 0;color:var(--muted);text-align:center}body.dark-mode{--bg:#252820;--paper:#31362b;--text:#f2eadf;--muted:#c9beaf;--line:rgba(255,255,255,.12);background:var(--bg);color:var(--text)}body.dark-mode .site-header,body.dark-mode .list-hero,body.dark-mode .section,body.dark-mode .site-footer{background:rgba(49,54,43,.92)}body.dark-mode .novel-card,body.dark-mode .btn-soft,body.dark-mode .nav-links a,body.dark-mode .nav-links button{background:#31362b;color:var(--text)}body.dark-mode .brand,body.dark-mode .list-hero h1,body.dark-mode .section h2,body.dark-mode .novel-card h3{color:#b8c8a4}body.dark-mode .list-hero p,body.dark-mode .novel-card p{color:#e6ddcf}@media(max-width:960px){.novel-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.nav{align-items:flex-start;flex-direction:column;padding:14px 0}.novel-grid{grid-template-columns:1fr}.novel-card img{height:320px}}</style></head><body><header class="site-hea
