<!DOCTYPE html>
<html lang="zh-CN" id="top">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>连载中小说｜泡菜小说坊</title>

  <!-- 当前文件在 status 文件夹里，所以路径前面要加 ../ -->
  <link rel="icon" href="../assets/images/logo/logo.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">

  <style>
    :root {
      --bg: #f6f0e5;
      --paper: #fffaf0;
      --sage: #7f9368;
      --sage-dark: #5f754b;
      --purple: #dcd5ee;
      --pink: #f1d3d7;
      --text: #3f3a32;
      --muted: #8a8175;
      --line: #eadfce;
      --warm: #cf9264;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(220, 213, 238, 0.55), transparent 35%),
        radial-gradient(circle at top right, rgba(241, 211, 215, 0.55), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .page-wrap {
      width: min(1120px, 92%);
      margin: 0 auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 250, 240, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      width: min(1120px, 92%);
      margin: 0 auto;
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--sage-dark);
      font-weight: 800;
      font-size: 22px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 14px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .nav-links a,
    .nav-links button {
      border: none;
      background: #fffaf0;
      color: var(--sage-dark);
      padding: 9px 14px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(95, 117, 75, 0.08);
    }

    .nav-links a:hover,
    .nav-links button:hover {
      background: var(--sage);
      color: #fff;
    }

    .list-hero {
      margin-top: 36px;
      background: rgba(255, 250, 240, 0.86);
      border: 1px solid var(--line);
      border-radius: 32px;
      padding: 36px;
      box-shadow: 0 20px 50px rgba(95, 117, 75, 0.12);
    }

    .list-hero h1 {
      margin: 0 0 12px;
      color: var(--sage-dark);
      font-size: clamp(34px, 6vw, 56px);
      letter-spacing: 0.04em;
    }

    .list-hero p {
      margin: 0;
      color: #514a42;
      line-height: 1.9;
    }

    .list-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .list-meta span {
      background: rgba(220, 213, 238, 0.55);
      border: 1px solid rgba(127, 147, 104, 0.18);
      color: var(--sage-dark);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 14px;
    }

    .section {
      margin-top: 34px;
      background: rgba(255, 250, 240, 0.86);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 14px 34px rgba(95, 117, 75, 0.08);
    }

    .section h2 {
      margin: 0 0 18px;
      color: var(--sage-dark);
      font-size: 26px;
    }

    .novel-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .novel-card {
      text-decoration: none;
      color: var(--text);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 10px 24px rgba(95, 117, 75, 0.10);
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .novel-card:hover {
      transform: translateY(-4px);
      border-color: var(--sage);
    }

    .novel-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 18px;
      display: block;
      background: linear-gradient(135deg, var(--purple), var(--pink));
    }

    .novel-card h3 {
      margin: 12px 0 8px;
      color: var(--sage-dark);
      font-size: 18px;
      line-height: 1.4;
    }

    .novel-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .novel-card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0;
    }

    .novel-card-meta span {
      font-size: 12px;
      color: var(--sage-dark);
      background: rgba(220, 213, 238, 0.55);
      padding: 5px 8px;
      border-radius: 999px;
    }

    .page-nav {
      margin: 34px 0 56px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-primary {
      background: var(--sage);
      color: #fff;
      box-shadow: 0 10px 22px rgba(127, 147, 104, 0.25);
    }

    .btn-primary:hover {
      background: var(--sage-dark);
    }

    .btn-soft {
      background: #fffaf0;
      color: var(--sage-dark);
      border-color: var(--line);
    }

    .btn-soft:hover {
      background: var(--purple);
    }

    .site-footer {
      border-top: 1px solid var(--line);
      background: rgba(255, 250, 240, 0.75);
      padding: 26px 0;
      color: var(--muted);
      text-align: center;
    }

    body.dark-mode {
      --bg: #252820;
      --paper: #31362b;
      --text: #f2eadf;
      --muted: #c9beaf;
      --line: rgba(255,255,255,0.12);
      background: #252820;
      color: var(--text);
    }

    body.dark-mode .site-header,
    body.dark-mode .list-hero,
    body.dark-mode .section,
    body.dark-mode .site-footer {
      background: rgba(49, 54, 43, 0.92);
    }

    body.dark-mode .novel-card,
    body.dark-mode .btn-soft,
    body.dark-mode .nav-links a,
    body.dark-mode .nav-links button {
      background: #31362b;
      color: var(--text);
    }

    body.dark-mode .brand,
    body.dark-mode .list-hero h1,
    body.dark-mode .section h2,
    body.dark-mode .novel-card h3 {
      color: #b8c8a4;
    }

    body.dark-mode .list-hero p,
    body.dark-mode .novel-card p {
      color: #e6ddcf;
    }

    body.dark-mode .list-meta span,
    body.dark-mode .novel-card-meta span {
      background: rgba(220, 213, 238, 0.12);
      color: #e6ddcf;
      border-color: rgba(255,255,255,0.12);
    }

    body.dark-mode .btn-primary {
      background: #7f9368;
      color: #fff;
    }

    @media (max-width: 960px) {
      .novel-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 720px) {
      .nav {
        align-items: flex-start;
        flex-direction: column;
        padding: 14px 0;
      }

      .novel-grid {
        grid-template-columns: 1fr;
      }

      .novel-card img {
        height: 320px;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="../index.html">
        <img src="../assets/images/logo/logo.png" alt="泡菜小说坊 Logo">
        <span>泡菜小说坊</span>
      </a>

      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a href="../stories.html">Stories</a>
        <a href="../search.html">搜索</a>
        <button type="button" id="backBtn">返回上一页</button>
        <button type="button" id="themeToggle">夜间模式</button>
      </div>
    </nav>
  </header>

  <main class="page-wrap">

    <section class="list-hero">
      <h1>连载中小说</h1>
      <p>这里展示泡菜小说坊中所有连载中的小说。后续新增连载作品时，只需要继续添加到下方作品列表里。</p>

      <div class="list-meta">
        <span>状态：连载中</span>
        <span id="workCount">作品数量：0</span>
        <span>持续更新中</span>
      </div>
    </section>

    <section class="section">
      <h2>全部连载中小说</h2>
      <div class="novel-grid" id="novelGrid"></div>
    </section>

    <div class="page-nav">
      <a class="btn btn-soft" href="../stories.html">← 返回小说列表</a>
      <a class="btn btn-primary" href="#top">返回顶部 ↑</a>
    </div>

  </main>

  <footer class="site-footer">
    <div class="page-wrap">
      <p>© 泡菜小说坊 Paocai Novels</p>
      <p>连载合集 · 免费试读 · 社交入口咨询</p>
    </div>
  </footer>

  <script>
    const pageData = {
      novels: [
        {
          title: "猎捕燕子",
          cover: "../assets/images/covers/hunting-swallow.png",
          link: "../novels/hunting-swallow.html",
          author: "Whale",
          authorLink: "../authors/whale.html",
          category: "BL",
          status: "连载中",
          summary: "危险的猎人与无法逃脱的燕子，在控制、试探与欲望之间展开一场极限拉扯。",
          tags: ["BL", "现代", "伪善纯爱", "暗黑拉扯"]
        }

        /*
          以后新增连载中小说时，在这里继续添加。

          示例：

          ,
          {
            title: "第二本连载小说",
            cover: "../assets/images/covers/second-cover.png",
            link: "../novels/second-novel.html",
            author: "作者名",
            authorLink: "../authors/author-name.html",
            category: "女频",
            status: "连载中",
            summary: "这里填写小说简介。",
            tags: ["现代", "悬疑", "爱情"]
          }
        */
      ]
    };

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderNovelList() {
      const novelGrid = document.getElementById("novelGrid");
      const workCount = document.getElementById("workCount");

      workCount.textContent = `作品数量：${pageData.novels.length}`;

      novelGrid.innerHTML = pageData.novels.map(novel => `
        <a class="novel-card" href="${novel.link}">
          <img src="${novel.cover}" alt="${escapeHTML(novel.title)}封面">
          <h3>${escapeHTML(novel.title)}</h3>
          <div class="novel-card-meta">
            <span>作者：${escapeHTML(novel.author)}</span>
            <span>${escapeHTML(novel.category)}</span>
            <span>${escapeHTML(novel.status)}</span>
          </div>
          <p>${escapeHTML(novel.summary)}</p>
          <div class="novel-card-meta">
            ${novel.tags.map(tag => `<span>${escapeHTML(tag)}</span>`).join("")}
          </div>
        </a>
      `).join("");
    }

    renderNovelList();

    const themeToggle = document.getElementById("themeToggle");
    const savedTheme = localStorage.getItem("paocai-theme");

    if (savedTheme === "dark") {
      document.body.classList.add("dark-mode");
      themeToggle.textContent = "日间模式";
    }

    themeToggle.addEventListener("click", function () {
      document.body.classList.toggle("dark-mode");

      if (document.body.classList.contains("dark-mode")) {
        localStorage.setItem("paocai-theme", "dark");
        themeToggle.textContent = "日间模式";
      } else {
        localStorage.setItem("paocai-theme", "light");
        themeToggle.textContent = "夜间模式";
      }
    });

    const backBtn = document.getElementById("backBtn");

    backBtn.addEventListener("click", function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "../stories.html";
      }
    });
  </script>

</body>
</html>
