<!DOCTYPE html>
<html lang="zh-CN" id="top">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小说详情｜泡菜小说坊</title>

  <!-- 当前文件放在 novels 文件夹里，所以路径前面要加 ../ -->
  <link rel="icon" href="../assets/images/logo/logo.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/novel.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">

  <style>
    :root {
      --bg: #f6f0e5;
      --paper: #fffaf0;
      --sage: #7f9368;
      --sage-dark: #5f754b;
      --purple: #dcd5ee;
      --pink: #f1d3d7;
      --text: #3f3a32;
      --muted: #8a8175;
      --line: #eadfce;
      --warm: #cf9264;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(220, 213, 238, 0.55), transparent 35%),
        radial-gradient(circle at top right, rgba(241, 211, 215, 0.55), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .page-wrap {
      width: min(1120px, 92%);
      margin: 0 auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 250, 240, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      width: min(1120px, 92%);
      margin: 0 auto;
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--sage-dark);
      font-weight: 800;
      font-size: 22px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 14px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .nav-links a,
    .nav-links button {
      border: none;
      background: #fffaf0;
      color: var(--sage-dark);
      padding: 9px 14px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(95, 117, 75, 0.08);
    }

    .nav-links a:hover,
    .nav-links button:hover {
      background: var(--sage);
      color: #fff;
    }

    .novel-hero {
      margin-top: 36px;
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 34px;
      align-items: start;
      background: rgba(255, 250, 240, 0.82);
      border: 1px solid var(--line);
      border-radius: 32px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(95, 117, 75, 0.12);
    }

    .cover-box {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      border-radius: 26px;
      padding: 12px;
    }

    .cover-box img {
      width: 100%;
      display: block;
      border-radius: 20px;
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.16);
    }

    .novel-info h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 6vw, 58px);
      color: var(--sage-dark);
      letter-spacing: 0.04em;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--muted);
    }

    .meta span,
    .meta a {
      background: rgba(220, 213, 238, 0.5);
      border: 1px solid rgba(127, 147, 104, 0.18);
      padding: 7px 12px;
      border-radius: 999px;
      color: var(--sage-dark);
      text-decoration: none;
      font-size: 14px;
    }

    .meta a:hover {
      background: var(--sage);
      color: #fff;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 16px 0 20px;
    }

    .tags a {
      text-decoration: none;
      color: var(--sage-dark);
      background: linear-gradient(135deg, var(--purple), #fff6fa);
      border: 1px solid rgba(127, 147, 104, 0.18);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 14px;
    }

    .tags a:hover {
      background: var(--sage);
      color: #fff;
    }

    .summary-card {
      background: var(--paper);
      border-left: 5px solid var(--sage);
      border-radius: 18px;
      padding: 18px 20px;
      line-height: 1.9;
      color: #4a433b;
    }

    .summary-card p {
      margin: 8px 0 0;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-primary {
      background: var(--sage);
      color: #fff;
      box-shadow: 0 10px 22px rgba(127, 147, 104, 0.25);
    }

    .btn-primary:hover {
      background: var(--sage-dark);
    }

    .btn-soft {
      background: #fffaf0;
      color: var(--sage-dark);
      border-color: var(--line);
    }

    .btn-soft:hover {
      background: var(--purple);
    }

    .section {
      margin-top: 34px;
      background: rgba(255, 250, 240, 0.86);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 14px 34px rgba(95, 117, 75, 0.08);
    }

    .section h2 {
      margin: 0 0 18px;
      color: var(--sage-dark);
      font-size: 26px;
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .character-card {
      background: var(--paper);
      border-radius: 22px;
      padding: 22px;
      border: 1px solid var(--line);
    }

    .character-card h3 {
      margin: 0 0 12px;
      color: var(--warm);
      font-size: 21px;
    }

    .character-card p {
      margin: 0;
      line-height: 1.9;
      color: #514a42;
    }

    .chapter-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .chapter-list a {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      text-decoration: none;
      color: var(--text);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 16px;
    }

    .chapter-list a:hover {
      border-color: var(--sage);
      background: #f7f3e9;
      color: var(--sage-dark);
    }

    .chapter-list small {
      color: var(--muted);
      white-space: nowrap;
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .social-card {
      text-decoration: none;
      color: var(--text);
      background: linear-gradient(135deg, #fffaf0, #f7eff8);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
      text-align: center;
    }

    .social-card:hover {
      transform: translateY(-2px);
      border-color: var(--sage);
    }

    .social-card strong {
      display: block;
      color: var(--sage-dark);
      margin-bottom: 8px;
      font-size: 18px;
    }

    .social-card span {
      color: var(--muted);
      font-size: 14px;
    }

    .recommend-intro {
      margin: -4px 0 18px;
      color: var(--muted);
      line-height: 1.8;
    }

    .recommend-slider {
      position: relative;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      padding: 4px 2px 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--sage) transparent;
    }

    .recommend-track {
      display: flex;
      gap: 18px;
      width: max-content;
    }

    .recommend-card {
      width: 178px;
      flex: 0 0 auto;
      text-decoration: none;
      color: var(--text);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 12px;
      box-shadow: 0 10px 24px rgba(95, 117, 75, 0.10);
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .recommend-card:hover {
      transform: translateY(-4px);
      border-color: var(--sage);
    }

    .recommend-card img {
      width: 100%;
      height: 238px;
      object-fit: cover;
      border-radius: 16px;
      display: block;
      background: linear-gradient(135deg, var(--purple), var(--pink));
    }

    .recommend-card strong {
      display: block;
      margin-top: 10px;
      color: var(--sage-dark);
      font-size: 16px;
      line-height: 1.45;
    }

    .recommend-card span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .recommend-control {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .recommend-control button {
      border: 1px solid var(--line);
      background: #fffaf0;
      color: var(--sage-dark);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 14px;
    }

    .recommend-control button:hover {
      background: var(--sage);
      color: #fff;
    }

    .page-nav {
      margin: 34px 0 56px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .site-footer {
      border-top: 1px solid var(--line);
      background: rgba(255, 250, 240, 0.75);
      padding: 26px 0;
      color: var(--muted);
      text-align: center;
    }

    body.dark-mode {
      --bg: #252820;
      --paper: #31362b;
      --text: #f2eadf;
      --muted: #c9beaf;
      --line: rgba(255,255,255,0.12);
      background: #252820;
      color: var(--text);
    }

    body.dark-mode .site-header,
    body.dark-mode .novel-hero,
    body.dark-mode .section,
    body.dark-mode .site-footer {
      background: rgba(49, 54, 43, 0.92);
    }

    body.dark-mode .summary-card,
    body.dark-mode .character-card,
    body.dark-mode .chapter-list a,
    body.dark-mode .btn-soft,
    body.dark-mode .social-card,
    body.dark-mode .nav-links a,
    body.dark-mode .nav-links button,
    body.dark-mode .recommend-card,
    body.dark-mode .recommend-control button {
      background: #31362b;
      color: var(--text);
    }

    body.dark-mode .character-card p,
    body.dark-mode .summary-card p,
    body.dark-mode .section p,
    body.dark-mode .recommend-intro,
    body.dark-mode .social-card span,
    body.dark-mode .recommend-card span,
    body.dark-mode .chapter-list small {
      color: #e6ddcf;
    }

    body.dark-mode .character-card h3 {
      color: #f0b27a;
    }

    body.dark-mode .section h2,
    body.dark-mode .social-card strong,
    body.dark-mode .recommend-card strong,
    body.dark-mode .novel-info h1,
    body.dark-mode .brand {
      color: #b8c8a4;
    }

    body.dark-mode .tags a,
    body.dark-mode .meta span,
    body.dark-mode .meta a {
      background: rgba(220, 213, 238, 0.12);
      color: #e6ddcf;
      border-color: rgba(255,255,255,0.12);
    }

    body.dark-mode .meta a:hover,
    body.dark-mode .tags a:hover {
      background: #7f9368;
      color: #fff;
    }

    body.dark-mode .btn-primary {
      background: #7f9368;
      color: #fff;
    }

    @media (max-width: 820px) {
      .novel-hero {
        grid-template-columns: 1fr;
        padding: 20px;
      }

      .cover-box {
        max-width: 330px;
        margin: 0 auto;
      }

      .character-grid,
      .chapter-list,
      .social-grid {
        grid-template-columns: 1fr;
      }

      .nav {
        align-items: flex-start;
        flex-direction: column;
        padding: 14px 0;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="../index.html">
        <img src="../assets/images/logo/logo.png" alt="泡菜小说坊 Logo">
        <span>泡菜小说坊</span>
      </a>

      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a href="../stories.html">Stories</a>
        <a href="../search.html">搜索</a>
        <button type="button" id="themeToggle">夜间模式</button>
      </div>
    </nav>
  </header>

  <main class="page-wrap">

    <section class="novel-hero">
      <div class="cover-box">
        <img id="novelCover" src="" alt="小说封面">
      </div>

      <div class="novel-info">
        <h1 id="novelTitle"></h1>

        <div class="meta" id="novelMeta"></div>

        <div class="tags" id="novelTags"></div>

        <div class="summary-card">

        <div class="action-row">
          <a class="btn btn-primary" id="readBtn" href="#">立即阅读</a>
          <a class="btn btn-soft" href="#chapters">查看章节</a>
          <a class="btn btn-soft" href="#social">继续阅读</a>
        </div>
      </div>
    </section>

    <section class="section" id="characters">
      <h2>主角介绍</h2>
      <div class="character-grid" id="characterGrid"></div>
    </section>

    <section class="section" id="chapters">
      <h2>章节目录</h2>
      <div class="chapter-list" id="chapterList"></div>
    </section>

    <section class="section" id="social">
      <h2>账号咨询</h2>

      <div class="recommend-slider" id="recommendSlider">
        <div class="recommend-track" id="recommendTrack"></div>
      </div>

      <div class="recommend-control">
        <button type="button" id="recommendPrev">← 上一组</button>
        <button type="button" id="recommendNext">下一组 →</button>
      </div>
    </section>

    <div class="page-nav" id="bottom">
      <a class="btn btn-soft" href="../stories.html">← 上一页：返回小说列表</a>
      <a class="btn btn-primary" id="nextPageBtn" href="#social">继续阅读 →</a>
    </div>

  </main>

  <footer class="site-footer">
    <div class="page-wrap">
      <p>© 泡菜小说坊 Paocai Novels</p>
      <p>免费试读 · 账号咨询 · 长篇阅读收藏</p>
    </div>
  </footer>

  <script>
    /*
      ==================================================
      小说详情页信息填写区
      ==================================================

      下次新增小说时，只需要复制本文件，然后修改 novelData。
      作者按钮通过 authorLink 跳转到作者主页。
    */

    const novelData = {
      title: "猎捕燕子",
      author: "Whale",
      authorLink: "../authors/whale.html",
      category: "耽美",
      status: "连载中",
      updateDate: "2026-05-26",
      cover: "../assets/images/covers/hunting-swallow.png",

      tags: [
        { name: "现代", link: "../tags/modern.html" },
        { name: "伪善纯爱", link: "../tags/suspense.html" },
        { name: "BL", link: "../tags/bl.html" },
        { name: "强制爱", link: "../tags/modern.html" },

      ],

      summary: `危险的猎人与无法逃脱的燕子，在控制、试探与欲望之间展开一场极限拉扯。
他以为自己只是被锁定的猎物，却不知道真正失控的人，早已不是他。
当温柔成为陷阱，靠近也变成狩猎，这场关系最终会通向救赎，还是更深的深渊？`,

      characters: [
        {
          role: "攻",
          name: "李姜周",
          intro: `外表冷静克制，习惯用理性与规则掌控一切。

在感情里，他并不轻易表露真实欲望，却会用最温柔的方式设下无法逃离的网。`
        },
        {
          role: "受",
          name: "车海俊",
          intro: `漂亮、卑微又机灵的男公关，为了还债周旋于客人之间。
看似油滑，实则胆小敏感，拥有极强的求生本能。
他不是单纯的猎物，也会在绝境里挣扎反击。`
        }
      ],

      chapters: [
        { title: "第1章", label: "免费阅读", link: "../chapters/hunting-swallow/chapter-1.html" },
        { title: "第2章", label: "免费阅读", link: "../chapters/hunting-swallow/chapter-2.html" },
        { title: "第3章", label: "免费阅读", link: "../chapters/hunting-swallow/chapter-3.html" },
        { title: "第4章", label: "免费阅读", link: "../chapters/hunting-swallow/chapter-4.html" },
        { title: "第5章", label: "免费阅读", link: "../chapters/hunting-swallow/chapter-5.html" },
        { title: "第6章", label: "免费阅读", link: "../chapters/hunting-swallow/chapter-6.html" },
        { title: "第7章", label: "免费阅读", link: "../chapters/hunting-swallow/chapter-7.html" },
        { title: "第8章", label: "免费阅读", link: "../chapters/hunting-swallow/chapter-8.html" },
        { title: "第9章", label: "免费阅读", link: "../chapters/hunting-swallow/chapter-9.html" },
        { title: "第10章", label: "免费阅读", link: "../chapters/hunting-swallow/chapter-10.html" }
      ],

      social: [
        {
          name: "微博",
          text: "查看更新 / 私信咨询",
          link: "https://weibo.com/"
        },
        {
          name: "微信",
          text: "扫码添加 / 咨询后续章节",
          link: "../assets/images/icons/wechat-qr.svg"
        },
        {
          name: "小红书",
          text: "作品动态 / 下单入口",
          link: "https://www.xiaohongshu.com/"
        }
      ],

      recommendIntro: "喜欢《猎捕燕子》的话，也可以看看这些现代、悬疑、暗黑拉扯类型的作品。封面卡片可以横向滑动，并会自动循环滚动。",

      recommend: [
        {

        {
          title: "反作用定律",

          link: "../novels/fanzuoyong.html"
        },
        {
          title: "灰梦档案",
          tag: "悬疑 · 秘密 · 追踪",
          cover: "../assets/images/covers/huimeng-cover.svg",
          link: "../novels/huimeng.html"
        },
        {
          title: "月色便利店",
          tag: "都市 · 温柔 · 治愈",
          cover: "../assets/images/covers/yuese-cover.svg",
          link: "../novels/yuese.html"
        },
        {
          title: "猎捕燕子",
          tag: "现代 · 悬疑 · 暗黑拉扯",
          cover: "../assets/images/covers/hunting-swallow.png",
          link: "../novels/hunting-swallow.html"
        }
      ]
    };

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function textToHTML(value) {
      return escapeHTML(value).replace(/\n/g, "<br>");
    }

    function renderNovelPage(data) {
      document.title = `${data.title}｜泡菜小说坊`;

      const cover = document.getElementById("novelCover");
      cover.src = data.cover;
      cover.alt = `${data.title}封面`;

      document.getElementById("novelTitle").textContent = data.title;

      document.getElementById("novelMeta").innerHTML = `
        <a href="${data.authorLink}">作者：${escapeHTML(data.author)}</a>
        <span>分类：${escapeHTML(data.category)}</span>
        <span>状态：${escapeHTML(data.status)}</span>
        <span>更新：${escapeHTML(data.updateDate)}</span>
      `;

      document.getElementById("novelTags").innerHTML = data.tags.map(tag => `
        <a href="${tag.link}">${escapeHTML(tag.name)}</a>
      `).join("");

      document.getElementById("novelSummary").innerHTML = textToHTML(data.summary);

      const firstChapter = data.chapters[0] ? data.chapters[0].link : "#chapters";

      document.getElementById("readBtn").href = firstChapter;
      document.getElementById("nextPageBtn").href = "#social";

      document.getElementById("characterGrid").innerHTML = data.characters.map(item => `
        <article class="character-card">
          <h3>${escapeHTML(item.role)}｜${escapeHTML(item.name)}</h3>
          <p>${textToHTML(item.intro)}</p>
        </article>
      `).join("");

      document.getElementById("chapterList").innerHTML = data.chapters.map(chapter => `
        <a href="${chapter.link}">
          <span>${escapeHTML(chapter.title)}</span>
          <small>${escapeHTML(chapter.label)}</small>
        </a>
      `).join("");

      document.getElementById("socialGrid").innerHTML = data.social.map(item => `
        <a class="social-card" href="${item.link}" target="_blank" rel="noopener">
          <strong>${escapeHTML(item.name)}</strong>
          <span>${escapeHTML(item.text)}</span>
        </a>
      `).join("");

      document.getElementById("recommendIntro").textContent = data.recommendIntro;

      const recommendCards = data.recommend.map(item => `
        <a class="recommend-card" href="${item.link}">
          <img src="${item.cover}" alt="${escapeHTML(item.title)}封面">
          <strong>${escapeHTML(item.title)}</strong>
          <span>${escapeHTML(item.tag)}</span>
        </a>
      `).join("");

      const recommendCardsClone = data.recommend.map(item => `
        <a class="recommend-card" href="${item.link}" aria-hidden="true" tabindex="-1">
          <img src="${item.cover}" alt="">
          <strong>${escapeHTML(item.title)}</strong>
          <span>${escapeHTML(item.tag)}</span>
        </a>
      `).join("");

      document.getElementById("recommendTrack").innerHTML = recommendCards + recommendCardsClone;
    }

    renderNovelPage(novelData);

    const themeToggle = document.getElementById("themeToggle");
    const savedTheme = localStorage.getItem("paocai-theme");

    if (savedTheme === "dark") {
      document.body.classList.add("dark-mode");
      themeToggle.textContent = "日间模式";
    }

    themeToggle.addEventListener("click", function () {
      document.body.classList.toggle("dark-mode");

      if (document.body.classList.contains("dark-mode")) {
        localStorage.setItem("paocai-theme", "dark");
        themeToggle.textContent = "日间模式";
      } else {
        localStorage.setItem("paocai-theme", "light");
        themeToggle.textContent = "夜间模式";
      }
    });

    const recommendSlider = document.getElementById("recommendSlider");
    const recommendPrev = document.getElementById("recommendPrev");
    const recommendNext = document.getElementById("recommendNext");

    if (recommendSlider && recommendPrev && recommendNext) {
      let isPaused = false;

      function getHalfScrollWidth() {
        return recommendSlider.scrollWidth / 2;
      }

      function loopRecommend() {
        if (!isPaused) {
          recommendSlider.scrollLeft += 1;

          if (recommendSlider.scrollLeft >= getHalfScrollWidth()) {
            recommendSlider.scrollLeft = 0;
          }
        }
      }

      window.setInterval(loopRecommend, 28);

      recommendSlider.addEventListener("mouseenter", function () {
        isPaused = true;
      });

      recommendSlider.addEventListener("mouseleave", function () {
        isPaused = false;
      });

      recommendPrev.addEventListener("click", function () {
        isPaused = true;
        recommendSlider.scrollBy({ left: -220, behavior: "smooth" });
        window.setTimeout(function () { isPaused = false; }, 1200);
      });

      recommendNext.addEventListener("click", function () {
        isPaused = true;
        recommendSlider.scrollBy({ left: 220, behavior: "smooth" });

        if (recommendSlider.scrollLeft >= getHalfScrollWidth()) {
          recommendSlider.scrollLeft = 0;
        }

        window.setTimeout(function () { isPaused = false; }, 1200);
      });
    }
  </script>

</body>
</html>
