<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TXT章节切割 HTML生成器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">Paocai Novels · 本地工具</p>
      <h1>TXT章节切割 HTML生成器</h1>
      <p>导入整本 TXT，自动识别章节标题，生成每章 HTML、目录页和 manifest.json，并打包成 ZIP。</p>
    </header>

    <section class="panel">
      <label class="field">
        <span>小说标题</span>
        <input id="novelTitle" type="text" placeholder="例如：反作用定律" />
      </label>

      <label class="field">
        <span>小说英文/拼音目录名 slug</span>
        <input id="novelSlug" type="text" placeholder="例如：the-law-of-reaction" />
      </label>

      <label class="field">
        <span>上传 TXT 文件</span>
        <input id="txtFile" type="file" accept=".txt,text/plain" />
      </label>

      <details class="advanced">
        <summary>高级设置</summary>
        <label class="field">
          <span>自定义章节识别正则，每行一个</span>
          <textarea id="customRules" rows="6" placeholder="例如：^第[一二三四五六七八九十百千万\d]+[章节回].*$"></textarea>
        </label>
        <label class="check"><input id="keepLineBreaks" type="checkbox" checked /> 保留段内换行</label>
        <label class="check"><input id="makeBilingual" type="checkbox" /> 生成双语段落样式 class：ko / zh</label>
      </details>

      <div class="actions">
        <button id="previewBtn">预览切割结果</button>
        <button id="downloadBtn" disabled>下载 HTML ZIP</button>
      </div>
    </section>

    <section class="panel result">
      <h2>切割预览</h2>
      <p id="status" class="status">还没有导入 TXT。</p>
      <div id="preview" class="preview"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
