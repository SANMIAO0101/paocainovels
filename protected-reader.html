<!DOCTYPE html>
<html lang="zh-CN" id="top">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>受保护章节｜泡菜小说坊</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="icon" href="assets/images/logo/logo.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    :root{--bg:#f6f0e5;--paper:#fffaf0;--sage:#7f9368;--sage-dark:#5f754b;--text:#3f3a32;--muted:#8a8175;--line:#eadfce}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}.page-wrap{width:min(920px,92%);margin:0 auto}.site-header{border-bottom:1px solid var(--line);background:rgba(255,250,240,.92);position:sticky;top:0;z-index:20}.nav{width:min(1120px,92%);margin:0 auto;min-height:72px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--sage-dark);font-weight:800;font-size:22px}.brand img{width:46px;height:46px;object-fit:contain;border-radius:14px}.nav-links{display:flex;gap:10px;flex-wrap:wrap}.nav-links a,.nav-links button{border:none;background:#fffaf0;color:var(--sage-dark);padding:9px 14px;border-radius:999px;text-decoration:none;cursor:pointer;font-size:15px}.nav-links a:hover,.nav-links button:hover{background:var(--sage);color:#fff}.reader-header,.login-box,.reader-paper{margin-top:28px;background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 14px 34px rgba(95,117,75,.08)}.reader-header h1{margin:0 0 10px;color:var(--sage-dark);font-size:32px}.reader-header p{margin:0;color:var(--muted)}.login-box input{width:100%;min-height:44px;padding:0 14px;border-radius:14px;border:1px solid var(--line);font-size:16px;margin:10px 0;background:#fff}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;border-radius:999px;text-decoration:none;border:1px solid transparent;cursor:pointer;font-size:15px}.btn-primary{background:var(--sage);color:#fff}.btn-soft{background:#fffaf0;color:var(--sage-dark);border-color:var(--line)}.toolbar,.page-nav{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.sentence-block{padding:18px 0;border-bottom:1px dashed var(--line)}.sentence-block:last-child{border-bottom:none}.ko{font-size:22px;line-height:2;margin:0 0 8px;cursor:pointer}.cn{font-size:17px;line-height:1.8;color:var(--muted);margin:0}.protected-content{position:relative;user-select:none}.protected-content::before{content:attr(data-watermark);position:fixed;top:45%;left:50%;transform:translate(-50%,-50%) rotate(-20deg);font-size:28px;color:rgba(127,147,104,.14);pointer-events:none;z-index:3;white-space:nowrap}.load-status{color:var(--muted);line-height:1.8}.site-footer{margin-top:40px;border-top:1px solid var(--line);background:rgba(255,250,240,.75);padding:26px 0;color:var(--muted);text-align:center}body.dark-mode{--bg:#252820;--paper:#31362b;--text:#f2eadf;--muted:#c9beaf;--line:rgba(255,255,255,.12);background:var(--bg);color:var(--text)}body.dark-mode .site-header,body.dark-mode .reader-header,body.dark-mode .reader-paper,body.dark-mode .login-box,body.dark-mode .site-footer{background:rgba(49,54,43,.94)}body.dark-mode .brand,body.dark-mode .reader-header h1{color:#b8c8a4}body.dark-mode .btn-soft,body.dark-mode .nav-links a,body.dark-mode .nav-links button{background:#31362b;color:var(--text)}@media(max-width:720px){.nav{align-items:flex-start;flex-direction:column;padding:14px 0}.ko{font-size:20px}}
  </style>
</head>
<body>
  <header class="site-header"><nav class="nav"><a class="brand" href="index.html"><img src="assets/images/logo/logo.png" alt="泡菜小说坊 Logo"><span>泡菜小说坊</span></a><div class="nav-links"><a href="index.html">Home</a><a href="stories.html">Stories</a><a href="search.html">搜索</a><button type="button" id="themeToggle">夜间模式</button></div></nav></header>
  <main class="page-wrap">
    <section class="reader-header"><h1 id="chapterTitle">受保护章节</h1><p id="novelTitle">请输入账号后阅读。</p></section>
    <section class="login-box" id="loginBox"><h2>会员登录</h2><p>本章节内容受保护，请登录后继续阅读。</p><input type="text" id="usernameInput" placeholder="账号"><input type="password" id="passwordInput" placeholder="密码"><div class="cf-turnstile" id="turnstileBox" data-sitekey="请替换为你的_Turnstile_Site_Key"></div><button class="btn btn-primary" type="button" id="loginBtn">登录阅读</button><p class="load-status" id="loginMessage"></p></section>
    <section class="reader-paper protected-content" id="readerBox" data-watermark="" hidden><div class="toolbar"><button class="btn btn-primary" type="button" id="loadAllBtn">加载全文</button><button class="btn btn-soft" type="button" id="readAllBtn">朗读已加载内容</button><button class="btn btn-soft" type="button" id="stopReadBtn">停止朗读</button><button class="btn btn-soft" type="button" id="logoutBtn">退出登录</button></div><p class="load-status" id="loadStatus">正在等待加载章节……</p><article id="chapterContent"></article></section>
    <div class="page-nav"><a class="btn btn-soft" id="backLink" href="stories.html">← 返回目录</a><a class="btn btn-primary" href="#top">返回顶部 ↑</a></div>
  </main>
  <footer class="site-footer"><div class="page-wrap"><p>© 泡菜小说坊 Paocai Novels</p><p>会员阅读 · 分段加载 · 禁止转载</p></div></footer>
  <script>
    const API_BASE="https://请替换为你的-worker-地址.workers.dev";
    const params=new URLSearchParams(window.location.search);
    const CHAPTER_ID=params.get("id")||"hunting-swallow-1";
    const back=params.get("back")||"novels/hunting-swallow.html";
    document.getElementById("backLink").href=back;
    const tokenKey="paocai_member_token";
    const loginBox=document.getElementById("loginBox"),readerBox=document.getElementById("readerBox"),usernameInput=document.getElementById("usernameInput"),passwordInput=document.getElementById("passwordInput"),loginBtn=document.getElementById("loginBtn"),loginMessage=document.getElementById("loginMessage"),novelTitle=document.getElementById("novelTitle"),chapterTitle=document.getElementById("chapterTitle"),chapterContent=document.getElementById("chapterContent"),loadStatus=document.getElementById("loadStatus");
    let loadedSegments=0,totalSegments=null,isLoading=false;
    loginBtn.addEventListener("click",login);passwordInput.addEventListener("keydown",e=>{if(e.key==="Enter")login()});
    async function login(){const username=usernameInput.value.trim();const password=passwordInput.value.trim();const turnstileToken=getTurnstileToken();if(!username||!password){loginMessage.textContent="请输入账号和密码。";return}if(!turnstileToken){loginMessage.textContent="请先完成人机验证。";return}loginMessage.textContent="正在登录……";const response=await fetch(`${API_BASE}/login`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password,turnstileToken})});const data=await response.json();if(!response.ok){loginMessage.textContent=data.error||"登录失败。";resetTurnstile();return}localStorage.setItem(tokenKey,data.token);loginMessage.textContent="登录成功，正在加载章节……";loginBox.hidden=true;readerBox.hidden=false;await loadNextSegment()}
    function getTurnstileToken(){const input=document.querySelector('[name="cf-turnstile-response"]');return input?input.value:""}function resetTurnstile(){if(window.turnstile)window.turnstile.reset()}
    async function getTicket(segmentIndex){const token=localStorage.getItem(tokenKey);const response=await fetch(`${API_BASE}/chapter-ticket`,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${token}`},body:JSON.stringify({chapterId:CHAPTER_ID,segmentIndex})});const data=await response.json();if(!response.ok)throw new Error(data.error||"获取阅读票据失败。");return data.ticket}
    async function loadSegment(segmentIndex){const ticket=await getTicket(segmentIndex);const url=`${API_BASE}/chapter-segment?id=${encodeURIComponent(CHAPTER_ID)}&part=${segmentIndex}&ticket=${encodeURIComponent(ticket)}`;const response=await fetch(url);const data=await response.json();if(!response.ok)throw new Error(data.error||"加载章节失败。");renderSegment(data);totalSegments=data.totalSegments;loadedSegments=segmentIndex+1;loadStatus.textContent=loadedSegments>=totalSegments?"本章已全部加载完成。":`已加载 ${loadedSegments} / ${totalSegments} 段。`}
    async function loadNextSegment(){if(isLoading)return;if(totalSegments!==null&&loadedSegments>=totalSegments){loadStatus.textContent="本章已全部加载完成。";return}isLoading=true;try{loadStatus.textContent="正在加载分段内容……";await loadSegment(loadedSegments)}catch(error){loadStatus.textContent=error.message;if(String(error.message).includes("登录")||String(error.message).includes("权限")){localStorage.removeItem(tokenKey);loginBox.hidden=false;readerBox.hidden=true}}finally{isLoading=false}}
    async function loadAllSegments(){while(totalSegments===null||loadedSegments<totalSegments){await loadNextSegment();await new Promise(resolve=>setTimeout(resolve,350));if(totalSegments!==null&&loadedSegments>=totalSegments)break}}
    function renderSegment(data){document.title=`${data.chapterTitle}｜${data.novelTitle}｜泡菜小说坊`;novelTitle.textContent=data.novelTitle;chapterTitle.textContent=data.chapterTitle;readerBox.setAttribute("data-watermark",data.watermark||"泡菜小说坊 · 禁止转载");const html=data.segment.blocks.map(block=>`<div class="sentence-block"><p class="ko" data-text="${escapeHTML(block.ko)}">${escapeHTML(block.ko)}</p><p class="cn">${escapeHTML(block.cn)}</p></div>`).join("");chapterContent.insertAdjacentHTML("beforeend",html);document.querySelectorAll(".ko:not([data-bound='1'])").forEach(item=>{item.dataset.bound="1";item.addEventListener("click",()=>speakText(item.dataset.text))})}
    function escapeHTML(value){return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function speakText(text){window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang="ko-KR";utterance.rate=.9;window.speechSynthesis.speak(utterance)}
    document.getElementById("loadAllBtn").addEventListener("click",loadAllSegments);document.getElementById("readAllBtn").addEventListener("click",()=>{const allText=Array.from(document.querySelectorAll(".ko")).map(item=>item.dataset.text).join("\n");if(!allText){alert("请先加载章节内容。");return}speakText(allText)});document.getElementById("stopReadBtn").addEventListener("click",()=>window.speechSynthesis.cancel());document.getElementById("logoutBtn").addEventListener("click",()=>{localStorage.removeItem(tokenKey);window.location.reload()});
    async function autoLoadIfLoggedIn(){const token=localStorage.getItem(tokenKey);if(!token){loginBox.hidden=false;readerBox.hidden=true;return}loginBox.hidden=true;readerBox.hidden=false;await loadNextSegment()}autoLoadIfLoggedIn();
    const themeToggle=document.getElementById("themeToggle"),savedTheme=localStorage.getItem("paocai-theme");if(savedTheme==="dark"){document.body.classList.add("dark-mode");themeToggle.textContent="日间模式"}themeToggle.addEventListener("click",()=>{document.body.classList.toggle("dark-mode");if(document.body.classList.contains("dark-mode")){localStorage.setItem("paocai-theme","dark");themeToggle.textContent="日间模式"}else{localStorage.setItem("paocai-theme","light");themeToggle.textContent="夜间模式"}});
    document.addEventListener("contextmenu",event=>event.preventDefault());document.addEventListener("copy",event=>{event.preventDefault();alert("本站内容仅供学习阅读，请勿复制转载。")});document.addEventListener("cut",event=>event.preventDefault());document.addEventListener("dragstart",event=>event.preventDefault());document.addEventListener("keydown",event=>{const key=String(event.key||"").toLowerCase();if(event.key==="F12"||(event.ctrlKey&&key==="u")||(event.ctrlKey&&key==="s")||(event.ctrlKey&&key==="c")||(event.ctrlKey&&key==="a")||(event.ctrlKey&&event.shiftKey&&key==="i")||(event.ctrlKey&&event.shiftKey&&key==="j")){event.preventDefault();alert("本站内容仅供学习阅读，请勿复制转载。")}});
  </script>
</body>
</html>
